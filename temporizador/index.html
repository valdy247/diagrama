<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d11">
  <meta name="description" content="Temporizador de pantalla completa. Establece horas, minutos y segundos y añade tiempo sin detener la cuenta regresiva.">
  <title>Temporizador — Pantalla completa</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-synthesis: none; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #0b0d11; color: #f5f6f8; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    :focus-visible { outline: 2px solid #c3ff70; outline-offset: 4px; }
    .app { isolation: isolate; min-height: 100vh; min-height: 100dvh; position: relative; display: flex; flex-direction: column; padding: clamp(18px, 2.4vw, 34px); overflow: hidden; }
    .app::before { content: ""; position: absolute; z-index: -1; pointer-events: none; width: 72vw; height: 72vw; max-width: 920px; max-height: 920px; top: -50vw; left: 50%; transform: translateX(-50%); background: radial-gradient(circle, rgba(134, 216, 83, .085), transparent 68%); }
    .app::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px); background-size: 56px 56px; mask-image: linear-gradient(to bottom, transparent, #000 70%); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: #f8f9fa; font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .2em; white-space: nowrap; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; background: #c3ff70; color: #0b0d11; border-radius: 11px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .top-label { color: #7f8792; font-size: 11px; text-transform: uppercase; letter-spacing: .2em; margin-right: 10px; }
    .icon-button { width: 44px; height: 44px; display: grid; place-items: center; color: #d7dce4; background: #191c22; border: 1px solid #292d34; border-radius: 14px; transition: background .2s ease, border-color .2s ease; }
    .icon-button:hover { background: #242931; border-color: #40474d; }
    .icon-button svg[hidden] { display: none; }
    .icon-button svg, .action svg { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .stage { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 290px; padding: clamp(32px, 6vh, 75px) 0 28px; }
    .eyebrow { font-size: 11px; color: #8e969f; letter-spacing: .25em; font-weight: 700; text-transform: uppercase; }
    .clock { margin: 12px 0 8px; white-space: nowrap; font-size: clamp(3.8rem, 12.4vw, 14rem); line-height: 1.14; letter-spacing: -.075em; font-weight: 750; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
    .clock .separator { color: #657065; }
    .stage[data-state="done"] .clock { color: #c3ff70; }
    .stage[data-state="done"] .clock .separator { color: #7b9f53; }
    .status { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #aab0b7; margin: 5px 0 31px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7c848f; }
    .stage[data-state="running"] .status-dot { background: #c3ff70; box-shadow: 0 0 0 5px rgba(195,255,112,.1); animation: pulse 1.5s infinite; }
    .stage[data-state="done"] .status-dot { background: #c3ff70; }
    .progress { width: min(680px, 85vw); height: 4px; overflow: hidden; border-radius: 999px; background: #272b31; }
    .progress-fill { height: 100%; width: 0%; background: #c3ff70; border-radius: inherit; transition: width .2s linear; }
    .actions { display: flex; gap: 12px; margin-top: 34px; justify-content: center; }
    .action { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 55px; padding: 0 27px; border-radius: 15px; font-weight: 700; font-size: 14px; transition: background .2s ease, transform .2s ease; }
    .action:hover:not(:disabled) { transform: translateY(-2px); }
    .action-primary { background: #c3ff70; color: #11170d; border: 1px solid #c3ff70; min-width: 172px; }
    .action-primary:hover { background: #d4ff9c; }
    .action-secondary { background: #1b1f25; color: #e3e6eb; border: 1px solid #353b43; }
    .action-secondary:hover { background: #292e35; }
    .control-area { width: min(1020px, 100%); align-self: center; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { background: rgba(24,27,32,.9); border: 1px solid #2b3037; border-radius: 22px; padding: clamp(18px, 2vw, 25px); box-shadow: 0 20px 80px rgba(0,0,0,.12); }
    .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
    .panel h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.03em; }
    .panel-kicker { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #777f89; font-weight: 700; white-space: nowrap; }
    .set-row { display: flex; align-items: flex-end; gap: 9px; }
    .unit { flex: 1; min-width: 0; }
    .unit label, .custom-add label { display: block; color: #9ca5af; font-size: 11px; margin-bottom: 8px; }
    .unit input, .custom-add input { display: block; width: 100%; height: 45px; color: #fff; text-align: center; background: #0e1116; border: 1px solid #363c44; border-radius: 11px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; }
    .unit input:focus, .custom-add input:focus { border-color: #c3ff70; box-shadow: 0 0 0 2px rgba(195,255,112,.12); }
    .set-button, .add-button { border: 1px solid #414950; border-radius: 11px; height: 45px; padding: 0 17px; color: #eff4e9; background: #2c3431; font-weight: 750; font-size: 12px; white-space: nowrap; }
    .set-button:hover, .add-button:hover { background: #3a493b; }
    .quick-add { display: flex; gap: 9px; margin-bottom: 12px; }
    .quick-add button { flex: 1; border: 1px solid #38423b; border-radius: 11px; color: #c3ff70; font-weight: 750; background: #202821; min-height: 43px; }
    .quick-add button:hover { background: #314130; }
    .custom-add { display: flex; gap: 9px; align-items: flex-end; }
    .custom-add > div { flex: 1; min-width: 0; }
    .custom-add input { text-align: left; padding: 0 13px; font-size: 14px; }
    .feedback { min-height: 22px; margin-top: 15px; font-size: 12px; text-align: center; color: #a2e17a; }
    .feedback.error { color: #ff9a91; }
    .footer { display: flex; justify-content: center; gap: 10px; color: #646c74; font-size: 11px; text-align: center; padding-top: 7px; }
    kbd { font: inherit; border: 1px solid #343940; border-radius: 5px; padding: 1px 5px; color: #a8afb7; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(195,255,112,.03); } }
    @media (max-width: 790px) {
      .top-label { display: none; }
      .app { padding: 19px 16px 23px; }
      .control-area { grid-template-columns: 1fr; max-width: 530px; gap: 12px; }
      .stage { min-height: 250px; padding: 35px 0 32px; }
      .clock { font-size: clamp(3rem, 12.6vw, 6rem); }
      .panel { padding: 19px; border-radius: 18px; }
      .panel-head { margin-bottom: 15px; }
      .footer { padding-top: 17px; }
    }
    @media (max-width: 420px) {
      .brand { font-size: 11px; gap: 8px; letter-spacing: .12em; }
      .brand-mark { width: 30px; height: 30px; }
      .clock { font-size: 12.8vw; }
      .stage { min-height: 235px; padding: 32px 0 25px; }
      .action { min-height: 50px; padding: 0 20px; }
      .action-primary { min-width: 142px; }
      .set-row { gap: 6px; }
      .set-button { padding: 0 11px; }
      .footer { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 8v5l3 2M9 2h6"></path></svg>
      </span> TEMPORIZADOR</div>
      <div class="top-actions">
        <span class="top-label">TU TIEMPO. TU RITMO.</span>
        <button class="icon-button" id="sound-button" type="button" aria-label="Silenciar aviso" aria-pressed="true" title="Activar o desactivar sonido">
          <svg id="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"></path></svg>
          <svg id="sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M11 5 6 9H3v6h3l5 4V5ZM16 9l5 6M21 9l-5 6"></path></svg>
        </button>
        <button class="icon-button" id="fullscreen-button" type="button" aria-label="Pantalla completa" title="Activar o salir de pantalla completa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"></path></svg>
        </button>
      </div>
    </header>

    <section class="stage" id="stage" data-state="ready" aria-labelledby="clock-label">
      <div class="eyebrow" id="clock-label">TIEMPO RESTANTE</div>
      <div class="clock" id="clock" role="timer" aria-live="off" aria-label="15 minutos restantes">00<span class="separator">:</span>15<span class="separator">:</span>00</div>
      <div class="status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="status-label">Listo para comenzar</span></div>
      <div class="progress" id="progress" role="progressbar" aria-label="Progreso de la cuenta regresiva" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="actions">
        <button class="action action-primary" type="button" id="start-button">
          <svg id="start-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"></path></svg>
          <span id="start-label">Iniciar</span>
        </button>
        <button class="action action-secondary" type="button" id="reset-button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"></path></svg>
          Reiniciar
        </button>
      </div>
    </section>

    <section class="control-area" aria-label="Controles del temporizador">
      <form class="panel" id="set-form">
        <div class="panel-head"><h2>Establecer duración</h2><span class="panel-kicker">01 / CONFIGURAR</span></div>
        <div class="set-row">
          <div class="unit"><label for="hours">Horas</label><input id="hours" type="number" inputmode="numeric" min="0" max="99" value="0" required></div>
          <div class="unit"><label for="minutes">Minutos</label><input id="minutes" type="number" inputmode="numeric" min="0" max="59" value="15" required></div>
          <div class="unit"><label for="seconds">Segundos</label><input id="seconds" type="number" inputmode="numeric" min="0" max="59" value="0" required></div>
          <button class="set-button" type="submit">Aplicar</button>
        </div>
      </form>

      <div class="panel">
        <div class="panel-head"><h2>Sumar tiempo</h2><span class="panel-kicker">02 / AÑADIR</span></div>
        <div class="quick-add" role="group" aria-label="Añadir minutos rápidamente">
          <button type="button" data-add="1">+1 min</button>
          <button type="button" data-add="5">+5 min</button>
          <button type="button" data-add="10">+10 min</button>
        </div>
        <form class="custom-add" id="add-form">
          <div><label for="extra-minutes">O introduce los minutos que quieras</label><input id="extra-minutes" type="number" inputmode="numeric" min="1" max="5999" step="1" placeholder="Ej. 25" required></div>
          <button class="add-button" type="submit">+ Añadir</button>
        </form>
      </div>
    </section>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <footer class="footer"><span><kbd>Espacio</kbd> Iniciar / pausar</span><span>·</span><span><kbd>F</kbd> Pantalla completa</span></footer>
  </main>
  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "diagrama-temporizador-v1";
      const MAX_MS = (99 * 3600 + 59 * 60 + 59) * 1000;
      const $ = (id) => document.getElementById(id);
      const stage = $("stage"), clock = $("clock"), status = $("status-label");
      const startButton = $("start-button"), startLabel = $("start-label");
      const progress = $("progress"), progressFill = $("progress-fill");
      const feedback = $("feedback");
      const fields = [$("hours"), $("minutes"), $("seconds")];
      let configuredMs = 15 * 60 * 1000;
      let remainingMs = configuredMs;
      let totalMs = configuredMs;
      let deadline = 0;
      let running = false;
      let finished = false;
      let hasStarted = false;
      let tickInterval = null;
      let soundEnabled = true;
      let audioContext = null;

      function format(ms) {
        const s = Math.ceil(Math.max(0, ms) / 1000);
        return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60]
          .map((n) => String(n).padStart(2, "0")).join(":");
      }
      function displayDuration(ms) {
        const secs = Math.ceil(ms / 1000);
        const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
        return [h ? h + " h" : "", m ? m + " min" : "", s ? s + " s" : ""].filter(Boolean).join(" ") || "0 s";
      }
      function announce(message, error = false) {
        feedback.textContent = message;
        feedback.classList.toggle("error", error);
      }
      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ configuredMs, remainingMs, totalMs, deadline, running, finished, hasStarted, soundEnabled })); }
        catch (_) { /* El temporizador funciona aunque no haya almacenamiento. */ }
      }
      function hydrate() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!raw || !Number.isFinite(raw.configuredMs) || raw.configuredMs <= 0 || raw.configuredMs > MAX_MS) return;
          if (!Number.isFinite(raw.remainingMs) || raw.remainingMs < 0 || raw.remainingMs > MAX_MS) return;
          configuredMs = raw.configuredMs;
          totalMs = Number.isFinite(raw.totalMs) && raw.totalMs >= configuredMs && raw.totalMs <= MAX_MS ? raw.totalMs : configuredMs;
          remainingMs = raw.remainingMs;
          hasStarted = Boolean(raw.hasStarted);
          finished = Boolean(raw.finished);
          soundEnabled = raw.soundEnabled !== false;
          if (raw.running && Number.isFinite(raw.deadline)) {
            remainingMs = Math.max(0, raw.deadline - Date.now());
            if (remainingMs > 0 && remainingMs <= MAX_MS) { running = true; deadline = raw.deadline; }
            else { remainingMs = 0; finished = true; }
          }
        } catch (_) { /* Datos antiguos o almacenamiento bloqueado. */ }
      }
      function syncFields() {
        const seconds = Math.floor(configuredMs / 1000);
        fields[0].value = Math.floor(seconds / 3600);
        fields[1].value = Math.floor((seconds % 3600) / 60);
        fields[2].value = seconds % 60;
      }
      function render() {
        const text = format(remainingMs);
        const parts = text.split(":");
        clock.innerHTML = parts[0] + '<span class="separator">:</span>' + parts[1] + '<span class="separator">:</span>' + parts[2];
        clock.setAttribute("aria-label", displayDuration(remainingMs) + " restantes");
        const state = finished ? "done" : running ? "running" : hasStarted ? "paused" : "ready";
        stage.dataset.state = state;
        status.textContent = finished ? "¡Tiempo terminado!" : running ? "Cuenta regresiva en curso" : hasStarted ? "Temporizador en pausa" : "Listo para comenzar";
        startLabel.textContent = finished ? "Repetir" : running ? "Pausar" : hasStarted ? "Continuar" : "Iniciar";
        $("start-icon").innerHTML = running ? '<path d="M8 5v14M16 5v14"></path>' : '<path d="m8 5 11 7-11 7V5Z"></path>';
        const percentage = totalMs ? Math.min(100, Math.max(0, (1 - remainingMs / totalMs) * 100)) : 0;
        progressFill.style.width = percentage.toFixed(2) + "%";
        progress.setAttribute("aria-valuenow", String(Math.round(percentage)));
        $("sound-on").hidden = !soundEnabled;
        $("sound-off").hidden = soundEnabled;
        $("sound-button").setAttribute("aria-pressed", String(soundEnabled));
        $("sound-button").setAttribute("aria-label", soundEnabled ? "Silenciar aviso" : "Activar aviso sonoro");
        document.title = running ? text + " · Temporizador" : "Temporizador — Pantalla completa";
      }
      function stopTicks() {
        if (tickInterval !== null) clearInterval(tickInterval);
        tickInterval = null;
      }
      function playFinishSound() {
        if (!soundEnabled) return;
        try {
          const AudioCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtor) return;
          audioContext = audioContext || new AudioCtor();
          if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
          const now = audioContext.currentTime;
          [0, 0.19, 0.38].forEach((offset) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = 740 + offset * 500;
            gain.gain.setValueAtTime(0.0001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.18, now + offset + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.25);
            oscillator.connect(gain).connect(audioContext.destination);
            oscillator.start(now + offset);
            oscillator.stop(now + offset + 0.27);
          });
        } catch (_) { /* Aviso visual disponible sin audio. */ }
      }
      function complete() {
        stopTicks();
        running = false;
        remainingMs = 0;
        finished = true;
        hasStarted = true;
        save(); render(); announce("¡Se acabó el tiempo!");
        playFinishSound();
      }
      function tick() {
        if (!running) return;
        remainingMs = Math.max(0, deadline - Date.now());
        if (remainingMs <= 0) complete();
        else render();
      }
      function start() {
        if (finished) { remainingMs = configuredMs; totalMs = configuredMs; finished = false; }
        if (remainingMs <= 0) { announce("Primero establece una duración mayor que cero.", true); return; }
        try {
          if (soundEnabled) {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (AudioCtor) { audioContext = audioContext || new AudioCtor(); audioContext.resume().catch(() => {}); }
          }
        } catch (_) { /* El navegador puede bloquear el audio. */ }
        deadline = Date.now() + remainingMs;
        running = true;
        hasStarted = true;
        stopTicks();
        tickInterval = setInterval(tick, 100);
        announce(""); save(); render();
      }
      function pause() {
        if (!running) return;
        remainingMs = Math.max(0, deadline - Date.now());
        running = false; stopTicks();
        if (remainingMs <= 0) { complete(); return; }
        save(); render(); announce("Temporizador pausado.");
      }
      function reset() {
        stopTicks(); running = false; finished = false; hasStarted = false;
        remainingMs = configuredMs; totalMs = configuredMs; deadline = 0;
        save(); render(); announce("Restablecido a " + displayDuration(configuredMs) + ".");
      }
      function applyDuration(event) {
        event.preventDefault();
        const numbers = fields.map((field) => Number(field.value));
        if (numbers.some((num) => !Number.isInteger(num) || num < 0) || numbers[0] > 99 || numbers[1] > 59 || numbers[2] > 59) {
          announce("Introduce horas (0–99), minutos (0–59) y segundos (0–59).", true); return;
        }
        const duration = (numbers[0] * 3600 + numbers[1] * 60 + numbers[2]) * 1000;
        if (duration < 1000 || duration > MAX_MS) { announce("El tiempo debe ser mayor que cero.", true); return; }
        configuredMs = duration;
        reset();
        announce("Duración establecida: " + displayDuration(duration) + ".");
      }
      function addTime(minutes) {
        if (!Number.isInteger(minutes) || minutes < 1 || minutes > 5999) {
          announce("Introduce entre 1 y 5999 minutos.", true); return;
        }
        const addition = minutes * 60000;
        const current = running ? Math.max(0, deadline - Date.now()) : remainingMs;
        if (current + addition > MAX_MS || totalMs + addition > MAX_MS) {
          announce("El temporizador no puede superar 99 h 59 min 59 s.", true); return;
        }
        remainingMs = current + addition;
        totalMs += addition;
        if (running) deadline = Date.now() + remainingMs;
        if (finished) { finished = false; hasStarted = false; }
        save(); render(); announce("+" + minutes + " min añadidos. Quedan " + displayDuration(remainingMs) + ".");
      }
      startButton.addEventListener("click", () => running ? pause() : start());
      $("reset-button").addEventListener("click", reset);
      $("set-form").addEventListener("submit", applyDuration);
      document.querySelectorAll("[data-add]").forEach((button) => {
        button.addEventListener("click", () => addTime(Number(button.dataset.add)));
      });
      $("add-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const input = $("extra-minutes");
        const value = Number(input.value);
        addTime(value);
        if (Number.isInteger(value) && value >= 1 && value <= 5999) input.value = "";
      });
      $("sound-button").addEventListener("click", () => { soundEnabled = !soundEnabled; save(); render(); });
      $("fullscreen-button").addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else announce("La pantalla completa no está disponible en este navegador.", true);
        } catch (_) { announce("No se pudo activar la pantalla completa.", true); }
      });
      document.addEventListener("fullscreenchange", () => {
        $("fullscreen-button").setAttribute("aria-label", document.fullscreenElement ? "Salir de pantalla completa" : "Pantalla completa");
      });
      window.addEventListener("keydown", (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.repeat || (event.target instanceof Element && event.target.closest("input, textarea, select, button"))) return;
        if (event.code === "Space") { event.preventDefault(); running ? pause() : start(); }
        if (event.key.toLowerCase() === "f") $("fullscreen-button").click();
      });
      document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
      hydrate(); syncFields(); render();
      if (running) { tickInterval = setInterval(tick, 100); tick(); }
    })();
  </script>
</body>
</html>
